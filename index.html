      <article class="chapter-article" id="ch1">
        <span class="badge">الباب الأول</span>
        <h3>المولد والنشأة</h3>
        <div class="meta-line">مكة المكرمة — عام الفيل</div>
        <div class="content">
          <p>
            وُلد النبي محمد ﷺ في مكة المكرمة، في عام عُرف بـ"عام الفيل"، لأبيه
            عبد الله بن عبد المطلب الذي توفي قبل ولادته، فنشأ يتيم الأب. كانت
            ولادته في بيت بني هاشم، أحد بطون قريش الكبرى، وهو البيت المعروف
            بالشرف والمكانة بين العرب.
          </p>
          <p>
            أرضعته السيدة حليمة السعدية في البادية كما كانت عادة قريش في إرسال
            أبنائهم للرضاعة عند البدو، فنشأ في بيئة تتميز بصفاء اللغة وقوة
            البنية. وبعد عودته إلى مكة، توفيت والدته آمنة بنت وهب وهو في السادسة
            من عمره، فكُفل بعدها من جده عبد المطلب.
          </p>
          <blockquote>
            "ووجدك يتيماً فآوى" — إشارة إلى رعاية الله له منذ نشأته الأولى.
          </blockquote>
          <p>
            بعد وفاة جده، انتقلت كفالته إلى عمه أبي طالب، الذي أحاطه برعايته
            وحمايته، وظل سنداً له طوال حياته حتى بعد بدء الدعوة، رغم بقائه على
            دين قومه.
          </p>
        </div>
        <a href="#chapters" class="back-link">العودة إلى الفهرس ↑</a>
      </article>

      <article class="chapter-article" id="ch2">
        <span class="badge">الباب الثاني</span>
        <h3>الصادق الأمين</h3>
        <div class="meta-line">مكة المكرمة — قبل البعثة</div>
        <div class="content">
          <p>
            نشأ محمد ﷺ بين أهل مكة معروفاً بصدقه وأمانته، حتى لُقّب بـ"الصادق
            الأمين" قبل أن يُبعث بالرسالة. عمل في رعي الأغنام، ثم في التجارة،
            وكان يرافق عمه أبا طالب في رحلات التجارة إلى الشام، فاكتسب خبرة
            واسعة في التعامل مع الناس.
          </p>
          <p>
            ذاع صيت أمانته بين تجار مكة، حتى عرضت عليه السيدة خديجة بنت خويلد،
            وهي من كبار تجار مكة، أن يخرج بتجارتها إلى الشام نظير أجر مضاعف،
            فحقق في تلك الرحلة ربحاً كبيراً وأمانة لافتة أثارت إعجابها.
          </p>
          <blockquote>
            ثقة الناس بصدقه وأمانته كانت تمهيداً لثقتهم برسالته فيما بعد.
          </blockquote>
          <p>
            تزوج النبي ﷺ من السيدة خديجة رضي الله عنها، وكانت أول من آمن به
            وصدّقه عند بدء الوحي، وظلت سنداً له في أصعب سنوات الدعوة الأولى حتى
            وفاتها.
          </p>
        </div>
        <a href="#chapters" class="back-link">العودة إلى الفهرس ↑</a>
      </article>

      <article class="chapter-article" id="ch3">
        <span class="badge">الباب الثالث</span>
        <h3>البعثة ونزول الوحي</h3>
        <div class="meta-line">غار حراء — بداية الرسالة</div>
        <div class="content">
          <p>
            قبل البعثة، كان النبي ﷺ يتعبد ويتأمل في غار حراء، يبتعد عن صخب مكة
            وما كان عليه قومه من عبادة الأوثان. وفي إحدى هذه الخلوات، نزل عليه
            الملك جبريل بأول آيات من القرآن الكريم، في حادثة عُرفت ببدء الوحي.
          </p>
          <blockquote>
            "اقرأ باسم ربك الذي خلق" — أول ما نزل من القرآن الكريم.
          </blockquote>
          <p>
            عاد النبي ﷺ إلى بيته مرتجفاً مما رآه، فطمأنته السيدة خديجة، وأخذته
            إلى ابن عمها ورقة بن نوفل، الذي بشّره بأنه نبي هذه الأمة، وأن ما رآه
            هو الوحي الذي نزل على من قبله من الأنبياء.
          </p>
          <p>
            كانت هذه اللحظة بداية رسالة استمرت ثلاثاً وعشرين عاماً، غيّرت وجه
            التاريخ، وأسست لدين خاتم يجمع الناس على توحيد الله ومكارم الأخلاق.
          </p>
        </div>
        <a href="#chapters" class="back-link">العودة إلى الفهرس ↑</a>
      </article>

      <article class="chapter-article" id="ch4">
        <span class="badge">الباب الرابع</span>
        <h3>الدعوة في مكة</h3>
        <div class="meta-line">مكة المكرمة — سنوات الدعوة الأولى</div>
        <div class="content">
          <p>
            بدأت الدعوة سرّية، حيث دعا النبي ﷺ أقرب المقربين إليه، فكان أبو بكر
            الصديق وعلي بن أبي طالب وزيد بن حارثة وخديجة من أوائل من آمن به.
            استمرت هذه المرحلة سنوات قليلة، يجتمع فيها المؤمنون في أماكن بعيدة
            عن أعين قريش.
          </p>
          <p>
            بعد ذلك، أُمر النبي ﷺ بإعلان الدعوة، فواجه رفضاً شديداً من زعماء
            قريش الذين رأوا في الدعوة تهديداً لمكانتهم ومصالحهم. تعرّض المسلمون
            الأوائل لأشكال متعددة من الأذى والمقاطعة، وصبروا على ذلك صبراً
            عظيماً.
          </p>
          <blockquote>
            "وما أرسلناك إلا رحمة للعالمين" — جوهر الرسالة وسط كل هذا الابتلاء.
          </blockquote>
          <p>
            ومع تصاعد الضغط، هاجر بعض المسلمين إلى الحبشة طلباً للأمان، في أول
            هجرة في تاريخ الإسلام، بينما ظل النبي ﷺ في مكة يواصل الدعوة بصبر
            وحكمة.
          </p>
        </div>
        <a href="#chapters" class="back-link">العودة إلى الفهرس ↑</a>
      </article>

      <article class="chapter-article" id="ch5">
        <span class="badge">الباب الخامس</span>
        <h3>الهجرة إلى المدينة</h3>
        <div class="meta-line">من مكة إلى يثرب</div>
        <div class="content">
          <p>
            بعد سنوات من الأذى والمقاطعة في مكة، ومع تزايد إيمان أهل يثرب
            (المدينة) بالدعوة، أُمر النبي ﷺ بالهجرة إليها. خرج برفقة أبي بكر
            الصديق رضي الله عنه في رحلة محفوفة بالمخاطر، تخفّيا عن أعين من كانوا
            يتعقبونهما.
          </p>
          <p>
            استقبل أهل المدينة النبي ﷺ استقبالاً عظيماً، وآووه ونصروه، فعُرفوا
            بعدها بـ"الأنصار"، في حين عُرف من هاجر معه من مكة بـ"المهاجرين". أسس
            النبي ﷺ في المدينة أول مجتمع مسلم منظم، ووضع وثيقة تنظم العلاقة بين
            مختلف فئات المدينة.
          </p>
          <blockquote>
            بداية الهجرة كانت بداية تأسيس أمة، لا مجرد انتقال من مكان إلى آخر.
          </blockquote>
          <p>
            من هذه النقطة، أصبحت المدينة المنورة مركزاً لانطلاق الدعوة
            الإسلامية، ومنها استمرت رسالة النبي ﷺ في الانتشار حتى اكتمل الدين،
            وعاد المسلمون فيما بعد إلى مكة فاتحين بلا قتال.
          </p>
        </div>
        <a href="#chapters" class="back-link">العودة إلى الفهرس ↑</a>
      </article>

      <article class="chapter-article" id="ch6">
        <span class="badge">الباب السادس</span>
        <h3>الصحابة الكرام</h3>
        <div class="meta-line">نخبة من رجال السيرة</div>
        <div class="content">
          <p>
            حمل صحابة النبي ﷺ رسالته من بعده، فكانوا قدوة في الإيمان والشجاعة
            والعدل، وفيما يلي نظرة مختصرة على أربعة من أبرزهم، وهم الخلفاء
            الراشدون رضي الله عنهم.
          </p>
        </div>
      </article>
